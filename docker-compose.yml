services:
  tavily-cloud-mcp:
    build: .
    container_name: tavily-cloud-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    volumes:
      # config.json 挂载为持久卷：面板配置的密钥、参数、账号密码都保存在这里
      # 首次部署请先 cp config.example.json config.json
      - ./config.json:/app/config.json
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
