services:
  tavily-cloud-mcp:
    build: .
    container_name: tavily-cloud-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # 密钥池配置：逗号分隔多个 key；也可在启动后通过管理面板添加
      # （面板添加的密钥会持久化到挂载的 config.json）
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - TAVILY_API_KEYS=${TAVILY_API_KEYS:-}
    volumes:
      # config.json 挂载为持久卷：面板配置的密钥、参数、账号密码都保存在这里
      - ./config.json:/app/config.json
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
